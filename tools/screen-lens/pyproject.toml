[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "screenlens"
version = "0.1.0"
description = "Screenshot-to-structure: a read-only OCR/template recognition workbench"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "Pillow>=9.0"]

[project.scripts]
screenlens = "screenlens.__main__:main"

[tool.setuptools]
packages = ["screenlens", "screenlens.capture", "screenlens.core", "screenlens.vision"]

[tool.setuptools.package-data]
screenlens = ["web/*"]
